name: Generate levels index

on:
  push:
    branches: [main]
    paths-ignore:
      - levels-index.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: levels-index-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test generator
        run: node --test tests/build-levels-index.test.mjs
      - name: Generate index
        run: node scripts/build-levels-index.mjs
      - name: Commit changed index
        run: |
          git add -- levels-index.json
          if git diff --cached --quiet; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update levels index"
          git push origin HEAD:main
